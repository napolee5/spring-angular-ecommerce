<!-- 🔵 LOGIN -->
<div class="login" *ngIf="!doReg && !forgotMode">

  <h1>Accedi o Registrati</h1>

  <!-- ✅ SUCCESS -->
  <p *ngIf="successMsg" style="color: lightgreen;">
    {{ successMsg }}
  </p>

  <!-- ❌ ERROR -->
  <p *ngIf="errorMsg" style="color: #ff0000;">
    {{ errorMsg }}
  </p>

  <form (ngSubmit)="login()">

    <input
      type="email"
      [(ngModel)]="loginData.email"
      name="email"
      placeholder="Email"
      required
    >

    <input
      type="password"
      [(ngModel)]="loginData.password"
      name="password"
      placeholder="Password"
      required
    >

    <button type="submit">
      Login
    </button>

  </form>

  <p
    style="cursor:pointer; color:blue;"
    (click)="goToForgot()"
  >
    Hai dimenticato la password?
  </p>

  <button (click)="doRegister()">
    Registrati
  </button>

</div>


<!-- 🟡 FORGOT PASSWORD - STEP 1 -->
<div class="forgot" *ngIf="forgotMode && step === 1">

  <h2>Recupera Password</h2>

  <p *ngIf="errorMsg" style="color:#ff0000;">
    {{ errorMsg }}
  </p>

  <input
    type="email"
    [(ngModel)]="forgotData.email"
    name="forgotEmail"
    placeholder="Inserisci email"
    required
  >

  <button
    type="button"
    (click)="sendEmail()"
  >
    Invia email
  </button>

  <button
    type="button"
    (click)="forgotMode = false; errorMsg = ''"
  >
    Indietro
  </button>

</div>


<!-- 🟢 FORGOT PASSWORD - STEP 2 -->
<div class="forgot" *ngIf="forgotMode && step === 2">

  <h2>Inserisci token e nuova password</h2>

  <p *ngIf="errorMsg" style="color:#fd0000;">
    {{ errorMsg }}
  </p>

  <input
    type="text"
    [(ngModel)]="forgotData.token"
    name="token"
    placeholder="Inserisci token ricevuto"
  >

  <input
    type="password"
    [(ngModel)]="forgotData.newPassword"
    name="newPassword"
    placeholder="Nuova password"
  >

  <button
    type="button"
    (click)="resetPassword()"
  >
    Reset Password
  </button>

  <button
    type="button"
    (click)="forgotMode = false; step = 1; errorMsg = ''"
  >
    Annulla
  </button>

</div>


<!-- 🔴 REGISTER -->
<div class="Registrati" *ngIf="doReg && !forgotMode">

  <h1>Registrati</h1>

  <p *ngIf="errorMsg" style="color:#ff0000;">
    {{ errorMsg }}
  </p>

  <form (ngSubmit)="register()">

    <input
      type="text"
      [(ngModel)]="registerData.firstName"
      name="firstName"
      placeholder="Nome"
      required
    >

    <input
      type="text"
      [(ngModel)]="registerData.lastName"
      name="lastName"
      placeholder="Cognome"
      required
    >

    <input
      type="email"
      [(ngModel)]="registerData.email"
      name="registerEmail"
      placeholder="Email"
      required
    >

    <input
      type="password"
      [(ngModel)]="registerData.password"
      name="registerPassword"
      placeholder="Password"
      required
    >

    <button type="submit">
      Conferma Registrazione
    </button>

    <button
    type="button"
    (click)="doReg = false; step = 1; errorMsg = ''"
  >
    Annulla
  </button>

  </form>

</div>
